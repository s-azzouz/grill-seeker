    <!-- Flames -->
    <path d="M285 83 C269 65 291 53 289 35 C310 51 317 65 308 82 Z" fill="#C7471E"/>
    <path d="M319 78 C302 56 329 42 327 20 C352 45 354 62 340 80 Z" fill="#C7471E"/>
