    <circle cx="387" cy="211" r="8" fill="#183B2B"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="800" letter-spacing="-2">
    <tspan fill="#183B2B">Grill</tspan><tspan fill="#C7471E"> Seeker</tspan>
  </text>
</svg>
