    <path d="M254 105 H386" fill="none" stroke="#FFF8ED" stroke-width="5"/>
    <path d="M242 111 Q320 127 398 111 L389 151 Q320 175 251 151 Z" fill="#183B2B"/>
    <!-- Cooking grate -->
